name: Release

# Tags come from the Forgejo repository through its push mirror (which prunes
# anything created only here), so this only turns a pushed tag into a GitHub
# release; HACS offers releases, not bare tags.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.2.0"
        required: true

permissions: {}

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Check the tag matches the manifest version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/hydronic/manifest.json"))["version"])')
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match manifest version ${version}"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          notes=$(git tag -l --format='%(contents)' "${TAG}")
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists already"
            exit 0
          fi
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "${TAG}" --notes "${notes:-Release ${TAG}}"
